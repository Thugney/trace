#version: '3.8'

services:
  backend:
    image: family-learning-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-learning-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      # Removed ./backend:/app mount - it was overwriting compiled dist/ folder
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/family.db
      - AVATAR_DIR=/app/data/avatars
      - GROK_API_KEY=${GROK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3001
    networks:
      - family-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: family-pwa-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      # Leave empty to use nginx proxy (relative /api path)
      - VITE_API_URL=
    networks:
      - family-network

networks:
  family-network:
    driver: bridge

volumes:
  data:
