<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#4F46E5"/>

  <!-- Book icon -->
  <g transform="translate(128, 128)">
    <!-- Book pages -->
    <rect x="40" y="20" width="180" height="220" rx="8" fill="#ffffff"/>
    <rect x="60" y="20" width="180" height="220" rx="8" fill="#E0E7FF"/>

    <!-- Book spine -->
    <rect x="130" y="20" width="8" height="220" fill="#818CF8"/>

    <!-- Lines representing text -->
    <line x1="80" y1="60" x2="200" y2="60" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="90" x2="200" y2="90" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="120" x2="200" y2="120" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="150" x2="180" y2="150" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>

    <!-- Graduation cap on top -->
    <g transform="translate(90, -30)">
      <polygon points="40,20 80,10 120,20 80,30" fill="#FCD34D"/>
      <rect x="77" y="20" width="6" height="40" fill="#FCD34D"/>
      <circle cx="80" cy="63" r="5" fill="#F59E0B"/>
    </g>
  </g>

  <!-- "LH" text at bottom -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">LH</text>
</svg>
